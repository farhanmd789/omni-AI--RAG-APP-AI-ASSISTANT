spring.application.name=spring-ai-demo
server.port=${PORT:8081}
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.project-id=${GOOGLE_PROJECT_ID}

# Chat Options
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite-preview

# Embedding Configuration
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001



# The Magic Line for Speed!
# This enables Virtual Threads to handle thousands of AI calls.
spring.threads.virtual.enabled=true

# PDF Upload Limits
# Spring multipart limits (50MB per file, 60MB per request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
# CRITICAL: Set Tomcat connector to -1 (unlimited) so it does NOT reset the TCP connection.
# Tomcat's own limit (default 2MB) causes ERR_CONNECTION_RESET before Spring can respond gracefully.
# Spring's multipart limits above will still enforce the size cap with a proper HTTP 413 response.
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1


# NEW: See the Advisor working in the terminal
logging.level.org.springframework.ai.chat.client.advisor=DEBUG


# Show your own Service logs
logging.level.com.cm.spring_ai_demo=DEBUG

# Show Spring AI's internal communication logs
logging.level.org.springframework.ai=DEBUG

# Optional: Color-coded logs for easier reading in terminal
spring.output.ansi.enabled=ALWAYS
